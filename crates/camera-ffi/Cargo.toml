[package]
name = "am-camera-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
[lib]
name = "am_camera"
crate-type = ["cdylib"]
[features]
default = []
shared-frames = ["am-sdk-support/shared-frames"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
am-sdk-support = { path = "../sdk-support" }
am-camera-core = { package = "am-camera", path = "../am-camera", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"
