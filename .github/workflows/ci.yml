name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --features am-sdk-support/shared-frames
      - name: Release build (shared frames)
        run: cargo build --release --locked -p am-camera-ffi -p am-vision-ffi --features am-camera-ffi/shared-frames,am-vision-ffi/shared-frames

  generator-consistency:
    name: ABI generator drift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated C headers
        run: node scripts/sdk/generate-abi.mjs --check
      - name: Check generated Python bindings
        run: node scripts/sdk/generate-python-abi.mjs --check
      - name: Check ABI contract and generated binding coverage
        run: |
          node scripts/sdk/check-bindings.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sdk/check-doc-coverage.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sdk/check-zero-semantics.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sdk/freeze-abi.mjs --check
      - name: Check SDK source boundary
        run: node scripts/sdk/check-boundary.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python ownership and loader diagnostics
        run: |
          python -B scripts/sdk/generate-csharp-types.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/sdk/test-safe-bindings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/sdk/test-sdk-load-diagnostics.py --python-only
